name: Promote frontend image

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment environment"
        required: true
        type: choice
        options: [dev]
      digest:
        description: "Digest verified in dev (sha256:...)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-22.04
    environment: ${{ inputs.target }}
    env:
      HARBOR_REGISTRY: harbor.jbnu.ac.kr
      HARBOR_PROJECT: jdevops
      IMAGE_NAME: jcode-front
    steps:
      - name: Validate digest
        env:
          IMAGE_DIGEST: ${{ inputs.digest }}
        run: |
          hex="${IMAGE_DIGEST#sha256:}"
          test "$hex" != "$IMAGE_DIGEST"
          test "${#IMAGE_DIGEST}" -eq 71
          case "$hex" in
            *[!0-9a-f]*|'') echo "digest must use sha256:<64 lowercase hex>"; exit 1 ;;
          esac
      - name: Harbor login
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          for attempt in 1 2 3 4 5; do
            if printf '%s' "$HARBOR_PASSWORD" | timeout 30 docker login "$HARBOR_REGISTRY" --username "$HARBOR_USERNAME" --password-stdin; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - uses: docker/setup-buildx-action@v3
      - name: Verify the existing artifact
        env:
          IMAGE_DIGEST: ${{ inputs.digest }}
        run: |
          image="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker buildx imagetools inspect "$image"
          echo "Verified image: $image" >> "$GITHUB_STEP_SUMMARY"
      - uses: azure/setup-kubectl@v4
      - uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Deploy verified image
        env:
          IMAGE_DIGEST: ${{ inputs.digest }}
          KUBE_NAMESPACE: ${{ vars.KUBE_NAMESPACE }}
          KUBE_DEPLOYMENT: ${{ vars.KUBE_DEPLOYMENT }}
          KUBE_CONTAINER: ${{ vars.KUBE_CONTAINER }}
        run: |
          : "${KUBE_NAMESPACE:?KUBE_NAMESPACE environment variable is required}"
          : "${KUBE_DEPLOYMENT:?KUBE_DEPLOYMENT environment variable is required}"
          : "${KUBE_CONTAINER:?KUBE_CONTAINER environment variable is required}"
          image="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          kubectl set image "deployment/${KUBE_DEPLOYMENT}" "${KUBE_CONTAINER}=${image}" -n "$KUBE_NAMESPACE"
          kubectl rollout status "deployment/${KUBE_DEPLOYMENT}" -n "$KUBE_NAMESPACE" --timeout=5m
