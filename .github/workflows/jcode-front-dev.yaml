name: jcode-front-dev

on:
  push:
    branches:
      - develop  # 개발 브랜치

jobs:
  build-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      HARBOR_REGISTRY: harbor.jbnu.ac.kr
      HARBOR_PROJECT: jsh2256
      IMAGE_NAME: jcode-front
    
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
      
      - name: Harbor 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      
      - name: Docker 이미지 빌드 및 푸시
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          provenance: true
          sbom: true

      - name: 이미지 digest 기록
        run: echo "${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
