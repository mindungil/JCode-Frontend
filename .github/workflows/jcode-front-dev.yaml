name: jcode-front-dev

on:
  push:
    branches:
      - develop  # 개발 브랜치

jobs:
  build-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      HARBOR_REGISTRY: harbor.jbnu.ac.kr
      HARBOR_PROJECT: jdevops
      IMAGE_NAME: jcode-front
    
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
      
      - name: Harbor 로그인
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          for attempt in 1 2 3 4 5; do
            if printf '%s' "$HARBOR_PASSWORD" | timeout 30 docker login "$HARBOR_REGISTRY" --username "$HARBOR_USERNAME" --password-stdin; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3
      
      - name: Docker 이미지 빌드 및 푸시
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          provenance: true
          sbom: true

      - name: 이미지 digest 기록
        run: echo "${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
