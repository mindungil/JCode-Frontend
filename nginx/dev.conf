server {
    listen 80;
    server_name jcode2.jbnu.ac.kr;

    root /usr/share/nginx/html;
    index index.html;

    # 전역 설정: 디렉토리 리스팅 비활성화 (보안)
    autoindex off;

    # 모든 디렉토리 요청 차단 (보안: 디렉토리 존재 정보 노출 방지)
    # 디렉토리로 끝나는 요청에 대해 404 반환
    location ~ ^/.+/$ {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    # 정적 파일 서빙
    location /static/ {
        root /usr/share/nginx/html;
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=31536000";
        autoindex off;
        try_files $uri =404;
    }

    # MIME 타입 설정 (필요 시)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        root /usr/share/nginx/html;
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=31536000";
    }
}
